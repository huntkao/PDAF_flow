name: format

on:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # pin 到與本機一致的版本，避免版本差異造成假失敗
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' | grep -v '^third_party/' || true)
          if [ -z "$files" ]; then
            echo "no C/C++ files to check"
            exit 0
          fi
          fail=0
          for f in $files; do
            if ! clang-format --dry-run --Werror "$f"; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "上列檔案不符合 .clang-format，請執行 clang-format -i <檔案> 後再推送。"
            exit 1
          fi
